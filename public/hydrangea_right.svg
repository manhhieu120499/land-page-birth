    <g transform="translate(52, 148) rotate(-28)">
      <path d="M -45,0 C -25,-28 20,-28 45,0 C 20,28 -25,28 -45,0 Z" fill="url(#leafGradR)"/>
      <path d="M -40,0 L 40,0 M -15,0 L -25,-12 M 5,0 L -5,-14 M 22,0 L 12,-11 M -10,0 L -20,12 M 10,0 L 0,14" stroke="#b7e4c7" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(196, 152) rotate(26)">
      <path d="M -44,0 C -22,-26 22,-26 44,0 C 22,26 -22,26 -44,0 Z" fill="url(#leafLightR)"/>
      <path d="M -38,0 L 38,0 M -12,0 L -22,-11 M 8,0 L -2,-13 M 24,0 L 14,-10 M -8,0 L -18,11 M 12,0 L 2,13" stroke="#d8f3dc" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(115, 42) rotate(-74) scale(0.82)">
      <path d="M -40,0 C -20,-24 20,-24 40,0 C 20,24 -20,24 -40,0 Z" fill="url(#leafLightR)"/>
      <path d="M -34,0 L 34,0" stroke="#d8f3dc" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Hydrangea Spherical Cluster -->
    <use href="#floretDeepR" transform="translate(76, 98) rotate(-14)"/>
    <use href="#floretDeepR" transform="translate(178, 96) rotate(16)"/>
    <use href="#floretDeepR" transform="translate(88, 154) rotate(-25)"/>
    <use href="#floretDeepR" transform="translate(172, 148) rotate(20)"/>
    <use href="#floretMidR" transform="translate(128, 62) rotate(-8)"/>
    <use href="#floretMidR" transform="translate(96, 72) rotate(15)"/>
    <use href="#floretMidR" transform="translate(160, 74) rotate(-22)"/>

    <use href="#floretSoftR" transform="translate(64, 126) rotate(12)"/>
    <use href="#floretSoftR" transform="translate(194, 124) rotate(-19)"/>
    <use href="#floretMidR" transform="translate(128, 166) rotate(-32)"/>
    <use href="#floretSoftR" transform="translate(102, 134) rotate(10)"/>
    <use href="#floretSoftR" transform="translate(154, 134) rotate(-14)"/>
    <use href="#floretMidR" transform="translate(104, 98) rotate(-22)"/>
    <use href="#floretMidR" transform="translate(152, 98) rotate(19)"/>

    <use href="#floretBlushR" transform="translate(82, 114) rotate(-18)"/>
    <use href="#floretBlushR" transform="translate(174, 116) rotate(14)"/>
    <use href="#floretBlushR" transform="translate(128, 86) rotate(6)"/>
    <use href="#floretBlushR" transform="translate(116, 146) rotate(-15)"/>
    <use href="#floretBlushR" transform="translate(144, 144) rotate(24)"/>
    <use href="#floretSoftR" transform="translate(128, 116) rotate(-5) scale(1.08)"/>

    <circle cx="52" cy="78" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="206" cy="84" r="3" fill="#ffd166" opacity="0.85"/>
    <circle cx="142" cy="184" r="2.8" fill="#ffffff" opacity="0.9"/>
