<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <defs>
    <radialGradient id="hydGlowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6e8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="leafLightR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <radialGradient id="petalDeepR" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#e63966"/>
    </radialGradient>
    <radialGradient id="petalMidR" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe5ec"/>
      <stop offset="100%" stop-color="#ff5d8f"/>
    </radialGradient>
    <radialGradient id="petalSoftR" cx="35%" cy="35%" r="65%">
