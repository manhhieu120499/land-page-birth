    <g id="floretBlushR">
      <ellipse cx="0" cy="-10" rx="8.5" ry="10" fill="url(#petalBlushR)" stroke="#ffb3c6" stroke-width="0.6"/>
      <ellipse cx="0" cy="10" rx="8.5" ry="10" fill="url(#petalBlushR)" stroke="#ffb3c6" stroke-width="0.6"/>
      <ellipse cx="-10" cy="0" rx="10" ry="8.5" fill="url(#petalBlushR)" stroke="#ffb3c6" stroke-width="0.6"/>
      <ellipse cx="10" cy="0" rx="10" ry="8.5" fill="url(#petalBlushR)" stroke="#ffb3c6" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffd166" stroke="#ff758f" stroke-width="0.8"/>
