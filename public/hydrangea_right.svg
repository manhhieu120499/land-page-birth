      <ellipse cx="0" cy="12" rx="9.5" ry="11" fill="url(#petalDeepR)" stroke="#ff4d6d" stroke-width="0.6"/>
      <ellipse cx="-12" cy="0" rx="11" ry="9.5" fill="url(#petalDeepR)" stroke="#ff4d6d" stroke-width="0.6"/>
      <ellipse cx="12" cy="0" rx="11" ry="9.5" fill="url(#petalDeepR)" stroke="#ff4d6d" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="3.2" fill="#fff3b0" stroke="#f77f00" stroke-width="0.8"/>
    </g>
    <g id="floretMidR">
      <ellipse cx="0" cy="-12" rx="9.5" ry="11" fill="url(#petalMidR)" stroke="#ff758f" stroke-width="0.6"/>
      <ellipse cx="0" cy="12" rx="9.5" ry="11" fill="url(#petalMidR)" stroke="#ff758f" stroke-width="0.6"/>
      <ellipse cx="-12" cy="0" rx="11" ry="9.5" fill="url(#petalMidR)" stroke="#ff758f" stroke-width="0.6"/>
      <ellipse cx="12" cy="0" rx="11" ry="9.5" fill="url(#petalMidR)" stroke="#ff758f" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="3.2" fill="#ffe5ec" stroke="#ff4d6d" stroke-width="0.8"/>
    </g>
    <g id="floretSoftR">
      <ellipse cx="0" cy="-11" rx="9" ry="10.5" fill="url(#petalSoftR)" stroke="#ff8fab" stroke-width="0.6"/>
      <ellipse cx="0" cy="11" rx="9" ry="10.5" fill="url(#petalSoftR)" stroke="#ff8fab" stroke-width="0.6"/>
      <ellipse cx="-11" cy="0" rx="10.5" ry="9" fill="url(#petalSoftR)" stroke="#ff8fab" stroke-width="0.6"/>
      <ellipse cx="11" cy="0" rx="10.5" ry="9" fill="url(#petalSoftR)" stroke="#ff8fab" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#fff3b0" stroke="#f4a261" stroke-width="0.8"/>
